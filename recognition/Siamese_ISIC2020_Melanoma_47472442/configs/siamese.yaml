# ResNet-18 contrastive embedding model fine-tuned from ImageNet initialisation.
model: siamese

epochs: 30
batch_size: 16
learning_rate: 0.0001
min_learning_rate: 0.000001
weight_decay: 0.0001
rotation_degrees: 15.0
color_jitter: 0.1
pairs_per_epoch: 4096
contrastive_weight: 0.1
contrastive_margin: 1.0
